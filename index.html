<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RA Gigs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090a; --panel:#0e1012; --line:#1e2226; --dim:#6b737b; --fg:#d7dbde; --hi:#ffffff; --accent:#ff3b2f;
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.5}
  body{padding:24px max(16px,env(safe-area-inset-left,0px)) 80px}
  .wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  h1{font-size:12px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;margin:0;color:var(--hi)}
  h1 span{color:var(--accent)}
  h2{font-size:11px;font-weight:400;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  .quote{color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;line-height:1.5}
  h1{line-height:1.5}
  .bar.top{align-items:center}
  .raven{display:block;flex:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .catlane{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none;z-index:30}
  .cat{position:absolute;left:0;bottom:0;width:48px;height:51px;pointer-events:auto;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .cat svg{display:block;width:48px;height:51px;overflow:visible}
  .cat svg *{transform-box:view-box}
  .cat .armL{transform-origin:19px 41px;transform:rotate(16deg)}
  .cat .armR{transform-origin:41px 41px;transform:rotate(-16deg)}
  .cat .bob{transform-origin:30px 60px}
  .cat .head{transform-origin:30px 38px}
  .cat .tail{transform-origin:40px 53px}
  .cat .fig{transform-origin:30px 60px}
  .cat.walking .fig{animation:waddle .5s ease-in-out infinite}
  .cat.walking .footL{animation:stepL .5s ease-in-out infinite}
  .cat.walking .footR{animation:stepR .5s ease-in-out infinite}
  .cat.walking .tail{animation:swish 1s ease-in-out infinite}
  .cat.dance .bob{animation:bob var(--b) ease-out infinite;animation-delay:var(--d)}
  .cat.dance .head{animation:tilt calc(var(--b) * 2) ease-in-out infinite;animation-delay:var(--d)}
  .cat.dance .armL{animation:armL calc(var(--b) * 2) ease-in-out infinite;animation-delay:var(--d)}
  .cat.dance .armR{animation:armR calc(var(--b) * 2) ease-in-out infinite;animation-delay:var(--d)}
  .cat.dance .tail{animation:swish calc(var(--b) * 2) ease-in-out infinite;animation-delay:var(--d)}
  @keyframes waddle{0%,100%{transform:rotate(-5deg)}25%,75%{transform:rotate(0) translateY(-2px)}50%{transform:rotate(5deg)}}
  @keyframes stepL{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-3px)}}
  @keyframes stepR{0%,50%,100%{transform:translateY(0)}75%{transform:translateY(-3px)}}
  @keyframes bob{0%,100%{transform:translateY(1px) scaleY(.94)}35%{transform:translateY(-4px) scaleY(1.03)}}
  @keyframes tilt{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  @keyframes armL{0%,100%{transform:rotate(165deg)}50%{transform:rotate(30deg)}}
  @keyframes armR{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-165deg)}}
  @keyframes swish{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  .searchrow{display:flex;gap:8px}
  .searchrow input{flex:1;min-width:0}
  .searchrow button{height:auto;flex:none}
  .foot{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:8px}
  .bar select{padding:6px 8px;font-size:11px;max-width:48vw}
  .ms{position:relative}
  .fbtn{display:inline-flex;align-items:center;height:32px;padding:0 10px;font-size:11px;line-height:1;text-transform:none;letter-spacing:0;white-space:nowrap}
  .ms > button{max-width:48vw;overflow:hidden;text-overflow:ellipsis}
  .panel{position:absolute;z-index:5;top:100%;left:0;margin-top:4px;min-width:230px;max-height:55vh;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:4px}
  .opt{display:flex;align-items:center;gap:10px;padding:7px 8px;font-size:12px;cursor:pointer}
  .opt:hover{background:#14171a}
  .opt input{width:auto;padding:0;accent-color:var(--accent)}
  .panel .clear{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);color:var(--accent);padding:8px;margin-bottom:4px}
  input,select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:0;padding:10px 12px;outline:none}
  input:focus,select:focus,button:focus-visible{border-color:var(--accent)}
  input{width:100%}
  button{cursor:pointer;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
  button:hover{border-color:var(--dim);color:var(--hi)}
  button.on{border-color:var(--dim);color:var(--hi)}
  #vlist:not(.on),#vcal:not(.on){background:var(--bg);color:var(--dim)}
  #vlist:not(.on):hover,#vcal:not(.on):hover{color:var(--hi)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .results{border:1px solid var(--line);border-top:0}
  .res{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--panel)}
  .res:last-child{border-bottom:0}
  .res:hover{background:#14171a}
  .res img,.ph{width:44px;height:44px;object-fit:cover;background:#15181b;filter:grayscale(1)}
  .res .n{color:var(--hi)} .res .s{color:var(--dim);font-size:11px}
  .res .add{color:var(--accent);font-size:11px;letter-spacing:.1em}
  [hidden]{display:none!important}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);padding:2px 2px 2px 8px;background:var(--panel);font-size:12px}
  .chip button{border:0;background:none;padding:2px 6px;color:var(--dim);font-size:14px;line-height:1}
  .chip button:hover{color:var(--accent)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
  .muted{color:var(--dim)}
  .month{display:flex;align-items:center;gap:12px;margin-top:26px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--accent);font-size:22px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .month:first-child{margin-top:0}
  .month svg{flex:none;width:20px;height:28px}
  .gig{display:grid;grid-template-columns:96px 1fr auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .gig .d{color:var(--hi);font-variant-numeric:tabular-nums}
  .gig .a{color:var(--hi)} .gig .v{color:var(--dim)}
  .gig .f{font-size:18px}
  .gig a{color:inherit;text-decoration:none} .gig a:hover .a{color:var(--accent)}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
  .dow{background:var(--bg);padding:6px;color:var(--dim);font-size:10px;letter-spacing:.15em;text-align:center}
  .cell{background:var(--panel);min-height:78px;padding:4px;overflow:hidden;cursor:pointer}
  .cell.out{background:var(--bg);opacity:.45}
  .cell.today{outline:1px solid var(--accent);outline-offset:-1px}
  .cell.sel{background:#171a1d}
  .cell .n{font-size:10px;color:var(--dim)}
  .ev{font-size:10px;color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--accent);padding-left:4px;margin-top:2px}
  .detail{margin-top:12px}
  .err{color:var(--accent)}
  @media(max-width:560px){
    .gig{grid-template-columns:72px 1fr auto;gap:10px}
    .cell{min-height:56px}.ev{font-size:0;border-left-width:6px;height:6px;margin-top:3px;padding:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar top"><h1>RA<span>/</span>GIGS</h1><span id="raven" class="quote">Raven is leven</span></div>

  <section>
    <div class="searchrow">
      <input id="q" type="search" placeholder="Find artist" aria-label="Find artist" autocomplete="off" spellcheck="false">
      <button id="tracktoggle" class="fbtn" type="button" aria-expanded="false">Followed</button>
    </div>
    <div id="results" class="results" hidden></div>
    <div id="searchmsg" class="muted" style="margin-top:8px"></div>
    <div id="chips" class="chips" style="margin-top:10px"></div>
  </section>

  <section>
    <div class="bar" style="margin-bottom:12px">
      <div class="row">
        <div class="ms">
          <button id="countryBtn" class="fbtn" type="button" aria-haspopup="true" aria-expanded="false">All countries ▾</button>
          <div id="countryPanel" class="panel" hidden></div>
        </div>
        <div class="ms">
          <button id="artistBtn" class="fbtn" type="button" aria-haspopup="true" aria-expanded="false">All artists ▾</button>
          <div id="artistPanel" class="panel" hidden></div>
        </div>
      </div>
      <div class="row">
        <button id="vlist" class="fbtn on">List</button>
        <button id="vcal" class="fbtn">Calendar</button>
      </div>
    </div>
    <div id="view"></div>
  </section>

  <div id="status" class="foot"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LS = 'ra-gigs-v1';
const state = Object.assign({ artists: [], gigs: {}, sort: 'asc', countries: [], artistIds: [], view: 'list', month: null, day: null, variant: 0, collapsed: true },
  (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } })());
state.month = null; state.day = null; state.sort = 'asc';
if (!Array.isArray(state.countries)) state.countries = [];
if (!Array.isArray(state.artistIds)) state.artistIds = [];
if (state.artist) { if (!state.artistIds.length) state.artistIds = [state.artist]; delete state.artist; } // older saved single filter
if (state.country) { if (!state.countries.length) state.countries = [state.country]; delete state.country; } // older saved single filter
const save = () => { try { localStorage.setItem(LS, JSON.stringify({ artists: state.artists, gigs: state.gigs, sort: state.sort, countries: state.countries, artistIds: state.artistIds, view: state.view, variant: state.variant, collapsed: state.collapsed })); } catch {} };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const flag = (code) => {
  if (!code) return '';
  let c = code.toUpperCase(); if (c === 'UK') c = 'GB';
  if (!/^[A-Z]{2}$/.test(c)) return '';
  return String.fromCodePoint(...[...c].map((x) => 127397 + x.charCodeAt(0)));
};

async function gql(query, variables) {
  const r = await fetch('/gql', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables }) });
  const raw = await r.text();
  let j = {};
  try { j = JSON.parse(raw); } catch {}
  if (!r.ok || j.errors) throw new Error((j.errors && j.errors[0] && j.errors[0].message) || 'HTTP ' + r.status + ': ' + raw.replace(/\s+/g, ' ').slice(0, 200));
  return j.data;
}

/* ---------- shared artist list (stored on the server) ---------- */
async function pushArtists() {
  try { await fetch('/api/artists', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state.artists) }); } catch {}
}
async function pullArtists() {
  try {
    const r = await fetch('/api/artists');
    if (!r.ok) return;
    const list = await r.json();
    if (!Array.isArray(list)) return;
    if (!list.length && state.artists.length) await pushArtists();
    else { state.artists = list; save(); }
  } catch {}
}

/* ---------- search ---------- */
const named = (t) => { while (t && t.ofType) t = t.ofType; return t; };
const hasList = (t) => { while (t) { if (t.kind === 'LIST') return true; t = t.ofType; } return false; };
const TYPEQ = (n) => `query{__type(name:"${n}"){fields{name type{kind name ofType{kind name ofType{kind name ofType{kind name}}}}}}}`;
let searchPlan = null;
async function planSearch() {
  if (searchPlan) return searchPlan;
  const s = (await gql(TYPEQ('Search'))).__type;
  if (!s || !s.fields) throw new Error('RA schema: type "Search" not found');
  const lf = s.fields.find((f) => hasList(f.type));
  if (!lf) throw new Error('RA schema: Search has no list field (fields: ' + s.fields.map((f) => f.name).join(', ') + ')');
  const el = named(lf.type).name;
  const e = (await gql(TYPEQ(el))).__type;
  if (!e || !e.fields) throw new Error('RA schema: result type ' + el + ' has no plain fields');
  const want = ['id', 'value', 'name', 'contentUrl', 'areaName', 'countryName', 'imageUrl', 'url'];
  const fields = e.fields.filter((f) => want.includes(f.name) && !hasList(f.type) && ['SCALAR', 'ENUM'].includes(named(f.type).kind)).map((f) => f.name);
  searchPlan = { list: lf.name, fields };
  return searchPlan;
}
async function searchArtists(t) {
  const d = await gql(`query S($t:String!){search(searchTerm:$t,limit:20,indices:[ARTIST],includeNonLive:true){id value areaName countryName contentUrl imageUrl searchType}}`, { t });
  const rows = Array.isArray(d.search) ? d.search : [];
  return rows.filter((r) => !r.searchType || String(r.searchType).toUpperCase() === 'ARTIST').map((r) => ({ id: r.id, value: r.value, contentUrl: r.contentUrl || '', areaName: r.areaName, countryName: r.countryName, imageUrl: r.imageUrl }));
}
let timer, seq = 0;
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  const t = $('q').value.trim();
  if (t.length < 2) { $('results').hidden = true; $('searchmsg').textContent = ''; return; }
  timer = setTimeout(() => doSearch(t), 300);
});
async function doSearch(t) {
  const my = ++seq; $('searchmsg').textContent = 'Searching…';
  try {
    const list = await searchArtists(t);
    if (my !== seq) return;
    $('searchmsg').textContent = list.length ? list.length + ' artists on Resident Advisor' : 'No artists found';
    $('results').hidden = !list.length;
    $('results').innerHTML = list.map((a, i) => {
      const slug = (a.contentUrl || '').split('/').filter(Boolean).pop();
      const has = state.artists.some((x) => x.id === a.id);
      const sub = [a.areaName, a.countryName].filter(Boolean).join(', ') || slug;
      return `<div class="res" data-i="${i}">${a.imageUrl ? `<img src="${esc(a.imageUrl)}" alt="">` : '<div class="ph"></div>'}<div><div class="n">${esc(a.value)}</div><div class="s">${esc(sub)} · ra.co/dj/${esc(slug)}</div></div><div class="add">${has ? 'ADDED' : '+ ADD'}</div></div>`;
    }).join('');
    $('results').onclick = (e) => {
      const el = e.target.closest('.res'); if (!el) return;
      const a = list[+el.dataset.i];
      const slug = (a.contentUrl || '').split('/').filter(Boolean).pop();
      addArtist({ id: a.id, name: a.value, slug });
      $('q').value = ''; $('results').hidden = true; $('searchmsg').textContent = '';
    };
  } catch (e) { if (my === seq) { $('searchmsg').innerHTML = '<span class="err">Search failed: ' + esc(e.message) + '</span>'; } }
}

/* ---------- artists ---------- */
function addArtist(a) {
  if (state.artists.some((x) => x.id === a.id)) return;
  state.artists.push(a); save(); renderChips(); pollCount = 0; pushArtists().then(() => loadGigs());
}
function removeArtist(id) {
  state.artists = state.artists.filter((a) => a.id !== id);
  delete state.gigs[id];
  state.artistIds = state.artistIds.filter((x) => x !== id);
  save(); pushArtists(); renderChips();
  render();
}
function renderArtistFilter() {
  state.artistIds = state.artistIds.filter((id) => state.artists.some((a) => a.id === id));
  const panel = $('artistPanel'), keep = panel.scrollTop;
  const list = state.artists.slice().sort((a, b) => a.name.localeCompare(b.name));
  panel.innerHTML = (state.artistIds.length ? '<button type="button" class="clear" data-clear="1">Clear selection</button>' : '') +
    list.map((a) => `<label class="opt"><input type="checkbox" data-id="${esc(a.id)}"${state.artistIds.includes(a.id) ? ' checked' : ''}><span>${esc(a.name)}</span></label>`).join('');
  panel.scrollTop = keep;
  const n = state.artistIds.length;
  const one = n === 1 ? (state.artists.find((a) => a.id === state.artistIds[0]) || {}).name : '';
  $('artistBtn').textContent = (n === 0 ? 'All artists' : n === 1 ? one : n + ' artists') + ' ▾';
}
function renderChips() {
  $('tracktoggle').textContent = state.collapsed ? 'Followed' : 'Followed · ' + state.artists.length;
  $('tracktoggle').setAttribute('aria-expanded', String(!state.collapsed));
  $('chips').hidden = state.collapsed;
  $('chips').innerHTML = state.artists.length
    ? state.artists.map((a) => `<div class="chip"><span>${esc(a.name)}</span><button data-id="${esc(a.id)}" aria-label="Remove ${esc(a.name)}">×</button></div>`).join('')
    : '<span class="muted">No artists yet. Search above and select one.</span>';
  $('chips').onclick = (e) => { const b = e.target.closest('button'); if (b) removeArtist(b.dataset.id); };
  renderArtistFilter();
}

/* ---------- gigs (collected and cached by the server) ---------- */
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
let pollTimer = null, pollCount = 0;
async function loadGigs() {
  clearTimeout(pollTimer);
  let d;
  try {
    const r = await fetch('/api/gigs');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
  } catch (e) { $('status').innerHTML = '<span class="err">Could not load gigs: ' + esc(e.message) + '</span>'; return; }
  state.gigs = d.gigs || {};
  save();
  render();
  const when = d.updatedAt ? new Date(d.updatedAt).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  $('status').innerHTML = esc(d.refreshing ? 'Updating from RA…' : when ? 'Updated ' + when : '') +
    (d.errors && d.errors.length ? '<br><span class="err">' + esc(d.errors.join(' | ')) + '</span>' : '');
  if (d.refreshing && pollCount++ < 60) pollTimer = setTimeout(loadGigs, 3000);
}

function allGigs() {
  const t = todayStr(), out = [];
  for (const a of state.artists) for (const g of state.gigs[a.id] || []) if (g.date >= t) out.push(Object.assign({ artist: a.name, artistId: a.id }, g));
  return out;
}
// Same event for several tracked artists becomes one row with all their names.
function groupGigs(list) {
  const m = new Map();
  for (const x of list) {
    const k = x.id || x.date + '|' + x.venue;
    const e = m.get(k);
    if (e) { if (!e.names.includes(x.artist)) e.names.push(x.artist); }
    else m.set(k, Object.assign({}, x, { names: [x.artist] }));
  }
  return [...m.values()].map((x) => Object.assign(x, { artist: x.names.join(', ') }));
}
function filtered() {
  let g = allGigs();
  if (state.countries.length) g = g.filter((x) => state.countries.includes(x.country));
  if (state.artistIds.length) g = g.filter((x) => state.artistIds.includes(x.artistId));
  g = groupGigs(g);
  g.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) * (state.sort === 'asc' ? 1 : -1));
  return g;
}

/* ---------- render ---------- */
const fmt = (s) => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
function gigRow(g) {
  const where = [g.venue, g.city].filter(Boolean).join(' · ');
  return `<div class="gig"><div class="d">${fmt(g.date)}</div><a href="${esc(g.url)}" target="_blank" rel="noopener"><div class="a">${esc(g.artist)}</div><div class="v">${esc(where)}${g.title ? ' — ' + esc(g.title) : ''}</div></a><div class="f" title="${esc(g.country)}">${flag(g.cc) || '—'}</div></div>`;
}
const monthHead = (ym) => {
  const [y, m] = ym.split('-').map(Number);
  const label = new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  return `<div class="month"><svg viewBox="0 0 20 28" aria-hidden="true"><line x1="1" y1="27" x2="19" y2="1" stroke="currentColor" stroke-width="1.5"/></svg><span>${esc(label)}</span></div>`;
};
function listHtml(g) {
  let out = '', cur = '';
  for (const x of g) {
    const ym = x.date.slice(0, 7);
    if (ym !== cur) { cur = ym; out += monthHead(ym); }
    out += gigRow(x);
  }
  return out;
}
function render() {
  const all = allGigs();
  const countries = [...new Set(all.map((g) => g.country).filter(Boolean))].sort();
  state.countries = state.countries.filter((c) => countries.includes(c));
  const ccOf = (c) => (all.find((g) => g.country === c) || {}).cc;
  const panel = $('countryPanel'), keep = panel.scrollTop;
  panel.innerHTML = (state.countries.length ? '<button type="button" class="clear" data-clear="1">Clear selection</button>' : '') +
    countries.map((c) => `<label class="opt"><input type="checkbox" data-c="${esc(c)}"${state.countries.includes(c) ? ' checked' : ''}><span>${flag(ccOf(c))} ${esc(c)}</span></label>`).join('');
  panel.scrollTop = keep;
  const n = state.countries.length;
  $('countryBtn').textContent = (n === 0 ? 'All countries' : n === 1 ? flag(ccOf(state.countries[0])) + ' ' + state.countries[0] : state.countries.slice(0, 4).map((c) => flag(ccOf(c))).join(' ') + ' · ' + n + ' countries') + ' ▾';
  $('vlist').classList.toggle('on', state.view === 'list');
  $('vcal').classList.toggle('on', state.view === 'cal');
  const g = filtered();
  if (!state.artists.length) { $('view').innerHTML = ''; return; }
  if (state.view === 'list') {
    $('view').innerHTML = g.length ? listHtml(g) : '<div class="muted">No upcoming gigs found.</div>';
  } else renderCal(g);
}
function renderCal(g) {
  if (!state.month) { const f = g[0] ? g.slice().sort((a, b) => (a.date < b.date ? -1 : 1))[0].date : todayStr(); state.month = f.slice(0, 7); }
  const [y, m] = state.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = (first.getDay() + 6) % 7, days = new Date(y, m, 0).getDate();
  const by = {}; g.forEach((x) => (by[x.date] = by[x.date] || []).push(x));
  let cells = '';
  ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'].forEach((d) => (cells += `<div class="dow">${d}</div>`));
  for (let i = 0; i < start; i++) cells += '<div class="cell out"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const evs = by[ds] || [];
    cells += `<div class="cell${ds === todayStr() ? ' today' : ''}${ds === state.day ? ' sel' : ''}" data-d="${ds}"><div class="n">${d}</div>${evs.slice(0, 3).map((e) => `<div class="ev">${flag(e.cc)} ${esc(e.artist)}</div>`).join('')}${evs.length > 3 ? `<div class="n">+${evs.length - 3}</div>` : ''}</div>`;
  }
  const title = first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }).toUpperCase();
  $('view').innerHTML = `<div class="cal-head"><button id="prev">←</button><span class="muted">${title}</span><button id="next">→</button></div><div class="grid">${cells}</div><div class="detail">${state.day && by[state.day] ? by[state.day].map(gigRow).join('') : '<span class="muted">Select a day.</span>'}</div>`;
  const shift = (n) => { const d = new Date(y, m - 1 + n, 1); state.month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); state.day = null; render(); };
  $('prev').onclick = () => shift(-1); $('next').onclick = () => shift(1);
  $('view').querySelector('.grid').onclick = (e) => { const c = e.target.closest('.cell[data-d]'); if (c) { state.day = c.dataset.d; render(); } };
}

/* ---------- wiring ---------- */
$('tracktoggle').onclick = () => { state.collapsed = !state.collapsed; save(); renderChips(); };
const PANELS = [['countryBtn', 'countryPanel'], ['artistBtn', 'artistPanel']];
const setPanel = (open, only) => PANELS.forEach(([b, p]) => {
  const o = open && (!only || only === p);
  $(p).hidden = !o; $(b).setAttribute('aria-expanded', String(o));
});
PANELS.forEach(([b, p]) => { $(b).onclick = () => setPanel($(p).hidden, p); });
$('artistPanel').onchange = (e) => {
  const id = e.target.dataset.id; if (!id) return;
  state.artistIds = e.target.checked ? [...state.artistIds, id] : state.artistIds.filter((x) => x !== id);
  state.day = null; save(); render(); renderArtistFilter();
};
$('artistPanel').onclick = (e) => { if (e.target.dataset.clear) { state.artistIds = []; state.day = null; save(); render(); renderArtistFilter(); } };
$('countryPanel').onchange = (e) => {
  const c = e.target.dataset.c; if (!c) return;
  state.countries = e.target.checked ? [...state.countries, c] : state.countries.filter((x) => x !== c);
  state.day = null; save(); render();
};
$('countryPanel').onclick = (e) => { if (e.target.dataset.clear) { state.countries = []; state.day = null; save(); render(); } };
document.addEventListener('click', (e) => { if (!e.composedPath().some((el) => el.classList && el.classList.contains('ms'))) setPanel(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setPanel(false); });
$('vlist').onclick = () => { state.view = 'list'; save(); render(); };
$('vcal').onclick = () => { state.view = 'cal'; save(); render(); };

renderChips(); render();
(async () => { await pullArtists(); renderChips(); render(); loadGigs(); })();
/* ---------- "RAVEN IS LEVEN": letters are windows onto a light show ---------- */
(function ravenLights() {
  const host = $('raven');
  if (!host) return;
  const TEXT = 'RAVEN IS LEVEN';
  const RED = '#ff3b2f', DEEP = '#b02a21'; // the app's red, plus a darker red
  const BEAT = 60 / 130; // 130 bpm, in seconds
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  cv.id = 'raven'; cv.className = 'raven'; cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', 'Raven is leven');
  const mask = document.createElement('canvas');
  const mctx = mask.getContext('2d');
  let W = 0, H = 0, size = 18, step = 0, gap = 0, dpr = 1, raf = 0;
  const font = () => `800 ${size}px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace`;

  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    size = innerWidth < 380 ? 12 : 15;
    gap = size * 0.18;
    mctx.font = font();
    step = mctx.measureText('M').width + gap;
    W = Math.ceil(step * TEXT.length - gap); H = Math.ceil(size * 1.5);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = mask.width = Math.round(W * dpr); cv.height = mask.height = Math.round(H * dpr);
    // the letters, drawn once; every frame the light show is cut down to this shape
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mctx.clearRect(0, 0, W, H);
    mctx.font = font(); mctx.textAlign = 'center'; mctx.textBaseline = 'middle'; mctx.fillStyle = '#000';
    for (let i = 0; i < TEXT.length; i++) if (TEXT[i] !== ' ') mctx.fillText(TEXT[i], i * step + (step - gap) / 2, H / 2 + 1);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function frame(t) {
    const s = t / 1000;
    const beat = s / BEAT, ph = beat % 1;            // beat counts up; ph runs 0..1 inside each beat
    const kick = reduce ? 0 : Math.exp(-ph * 6);      // pulse that peaks on every beat
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#2a2e32'; ctx.fillRect(0, 0, W, H);

    // soft strobe on every beat; in the last bar of each 4 it doubles to every half beat (the build-up)
    const build = Math.floor(beat / 4) % 4 === 3;
    const flash = !reduce && (ph < 0.16 || (build && ph >= 0.5 && ph < 0.66));
    if (flash) {
      ctx.fillStyle = '#c9cdd1'; ctx.fillRect(0, 0, W, H);
    } else {
      ctx.globalCompositeOperation = 'lighter';

      // 1. LED bar: thin grey stripes that step along one notch every half beat
      const per = 6, off = (Math.floor(beat * 2) % per);
      ctx.fillStyle = 'rgba(154,163,171,0.3)';
      for (let x = -per + off; x < W; x += per) ctx.fillRect(x, 0, 1.4, H);

      // 2. two narrow spotlights, one from the top and one from the bottom, panning in opposite directions
      for (let k = 0; k < 2; k++) {
        const top = k === 0, dir = top ? 1 : -1;
        const x0 = W * (0.5 + 0.46 * Math.sin(beat * Math.PI / 6 * (top ? 1 : 0.75) + (top ? 0 : Math.PI)));
        const tilt = Math.sin(beat * Math.PI / 3 + k) * 8 * dir;
        const y0 = top ? 0 : H, y1 = top ? H : 0;
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        const a0 = (top ? 0.95 : 0.65) + 0.2 * kick;
        g.addColorStop(0, `rgba(${top ? '255,255,255' : '201,205,209'},${a0})`);
        g.addColorStop(1, `rgba(${top ? '255,255,255' : '201,205,209'},0.06)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(x0 - 1.6, y0); ctx.lineTo(x0 + 1.6, y0);
        ctx.lineTo(x0 + 9 + tilt, y1); ctx.lineTo(x0 - 9 + tilt, y1);
        ctx.closePath(); ctx.fill();

      // 3. red lasers: thin, hard-edged lines fanning in from the top and bottom edges
      ctx.lineWidth = 1 + kick * 0.7;
      const n = 6;
      for (let i = 0; i < n; i++) {
        const top = i % 2 === 0, sx = W * (i + 0.5) / n, c = i % 3 === 2 ? DEEP : RED;

      }

      const y = H * (0.5 + 0.5 * Math.sin(beat * Math.PI / 2));

    }

    // keep only the letters: everything else is the page itself

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(mask, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = (t) => { frame(t); raf = requestAnimationFrame(loop); };
  function start() {
    host.replaceWith(cv);
    fit();
    if (reduce) frame(1500); else raf = requestAnimationFrame(loop);
    let tm;
    addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(() => { fit(); if (reduce) frame(1500); }, 150); });
  }

  /* ---------- easter egg: tap the text 3 times and a cat walks in and dances to the beat ---------- */
  const CAT_W = 48, CAT_H = 51, HEAD_ROOM = 10;
  const CAT_SVG = `<svg viewBox="0 0 60 64" aria-hidden="true"><g class="fig">
<g class="bob">
<g class="tail"><path d="M40 53 C55 54 58 40 51 31" fill="none" stroke="#8b6a47" stroke-width="5.4" stroke-linecap="round"/><path d="M40 53 C55 54 58 40 51 31" fill="none" stroke="#3a2a1c" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="2.2 4.2"/></g>
<ellipse cx="30" cy="47" rx="13" ry="12" fill="#8b6a47"/>
<path d="M18 42 l4 1 M18 47 l4 0 M42 42 l-4 1 M42 47 l-4 0" stroke="#3a2a1c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
<ellipse cx="30" cy="50" rx="7" ry="9.5" fill="#f4f1ec"/>
<g class="armL"><rect x="16.3" y="41" width="5.4" height="13" rx="2.7" fill="#8b6a47"/><circle cx="19" cy="53.5" r="3.4" fill="#f4f1ec"/></g>
<g class="armR"><rect x="38.3" y="41" width="5.4" height="13" rx="2.7" fill="#8b6a47"/><circle cx="41" cy="53.5" r="3.4" fill="#f4f1ec"/></g>
<g class="head">
<path d="M15.5 24 L14.5 7.5 L27.5 16 Z" fill="#8b6a47"/><path d="M44.5 24 L45.5 7.5 L32.5 16 Z" fill="#8b6a47"/>
<path d="M18 21 L17.6 11.5 L24.4 16.5 Z" fill="#e9a3a6"/><path d="M42 21 L42.4 11.5 L35.6 16.5 Z" fill="#e9a3a6"/>
<ellipse cx="30" cy="28" rx="15.5" ry="13" fill="#8b6a47"/>
<path d="M30 15.5 V20.5 M25.2 16.5 L26.2 20.8 M34.8 16.5 L33.8 20.8" stroke="#3a2a1c" stroke-width="1.7" stroke-linecap="round" fill="none"/>
<path d="M15 27.5 L19.5 28.5 M15.6 32 L20 31.2 M45 27.5 L40.5 28.5 M44.4 32 L40 31.2" stroke="#3a2a1c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<ellipse cx="30" cy="34.5" rx="8.5" ry="6.2" fill="#f4f1ec"/>
<ellipse cx="23.4" cy="27.5" rx="3.9" ry="4.3" fill="#a9d24c"/><ellipse cx="36.6" cy="27.5" rx="3.9" ry="4.3" fill="#a9d24c"/>
<ellipse cx="23.7" cy="27.8" rx="1.5" ry="3" fill="#111"/><ellipse cx="36.3" cy="27.8" rx="1.5" ry="3" fill="#111"/>
<circle cx="24.6" cy="26" r="1" fill="#fff"/><circle cx="37.2" cy="26" r="1" fill="#fff"/>
<path d="M28.3 31.4 H31.7 L30 33.4 Z" fill="#ee9aa0"/>
<path d="M30 33.4 V35.4 M30 35.4 Q28.2 37.2 26.6 35.8 M30 35.4 Q31.8 37.2 33.4 35.8" stroke="#2b2118" stroke-width="0.9" stroke-linecap="round" fill="none"/>
<path d="M21.5 34.2 L11 32.2 M21.8 35.8 L11.5 37.4 M38.5 34.2 L49 32.2 M38.2 35.8 L48.5 37.4" stroke="#d7dbde" stroke-width="0.6" stroke-linecap="round" opacity=".8" fill="none"/>
<circle cx="19" cy="33" r="2.4" fill="#ee9aa0" opacity=".35"/><circle cx="41" cy="33" r="2.4" fill="#ee9aa0" opacity=".35"/>
</g></g>
<ellipse class="footL" cx="23" cy="58.5" rx="5.2" ry="3.2" fill="#f4f1ec"/><ellipse class="footR" cx="37" cy="58.5" rx="5.2" ry="3.2" fill="#f4f1ec"/>
</g></svg>`;
  let lane = null, cat = null, catState = 'idle'; // idle -> in -> dance -> out -> idle

  const vw = () => document.documentElement.clientWidth;
  function targetX() { const r = cv.getBoundingClientRect(); return Math.round(r.left + r.width / 2 - CAT_W / 2); }

    cat.classList.add('walking');
    const dur = Math.max(900, Math.abs(to - from) / 90 * 1000); // about 90 px per second
    const a = cat.animate([{ transform: `translateX(${from}px)` }, { transform: `translateX(${to}px)` }], { duration: dur, easing: 'linear', fill: 'forwards' });

  }

    catState = 'in';

    cat.setAttribute('role', 'button'); cat.setAttribute('aria-label', 'Dancing cat. Tap to send it away.');

    cat.style.transform = `translateX(${vw()}px)`;
    walk(vw(), x, startDance);
  }
  function catOut() {
    if (catState !== 'dance') return;
    catState = 'out';
    const end = () => { lane.remove(); lane = cat = null; catState = 'idle'; };
    if (reduce) { end(); return; }
    cat.classList.remove('dance');
    walk(targetX(), vw(), end);
  }
  let taps = [];
  cv.addEventListener('click', () => {
    const now = performance.now();
    taps = taps.filter((t) => now - t < 900); taps.push(now);
    if (taps.length >= 3) { taps = []; if (catState === 'idle') catIn(); else catOut(); }
  });

  const ready = document.fonts && document.fonts.load ? document.fonts.load('800 18px "JetBrains Mono"') : Promise.resolve();
  Promise.race([ready, new Promise((r) => setTimeout(r, 1500))]).catch(() => {}).then(start);
})();
